# Netlify deployment configuration for LexiLingo Web Admin
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"
  
[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"
  VITE_ENV = "production"

# Redirect all routes to index.html for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
# NOTE on connect-src: it only allows 'self' + Google endpoints. That works
# when the admin SPA is served same-origin as the API (gateway/nginx), but a
# hosted Netlify deploy calling a cross-origin API will be CSP-blocked. Before
# deploying here, append the API origin(s) (e.g. https://api.example.com) to
# the connect-src list below — the Vercel deploy script does this injection
# automatically for vercel.json.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://static.cloudflareinsights.com https://vercel.live; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com https://accounts.google.com https://cdn.jsdelivr.net; frame-src https://accounts.google.com https://vercel.live; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://cloudflareinsights.com https://vercel.live; form-action 'self'"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Dev context
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Plugin for form handling (optional)
[[plugins]]
  package = "@netlify/plugin-sitemap"
