version: "3.9"

# Before `docker compose -f docker-compose.gateway.yml up`, render the nginx
# vhosts from their templates (nginx does not expand ${VAR} placeholders):
#     ./render-nginx.sh
# which reads ./gateway.env (see gateway.env.example) and writes
# nginx/conf.d/*.conf, the directory mounted below.
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: lexilingo-nginx-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - edge

  certbot:
    image: certbot/certbot:latest
    container_name: lexilingo-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
    restart: unless-stopped

networks:
  edge:
    driver: bridge
